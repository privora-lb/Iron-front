name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Headless harness
        run: npm test

      - name: Production build
        run: npm run build

      - name: Record the determinism hash
        run: |
          npm run test:sim | tee sim.json
          echo "### Determinism" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat sim.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the web build
        uses: actions/upload-artifact@v4
        with:
          name: iron-front-web
          path: dist/
          retention-days: 14

      # Render is connected to this repo by public URL rather than through the
      # GitHub App, so it gets no webhook and never hears about a push. Rather
      # than fix that, deploy from here — which is better anyway: every step
      # above has to pass first, so a build that fails its own checks can no
      # longer reach the live site.
      #
      # Needs one repository secret, RENDER_DEPLOY_HOOK, holding the deploy hook
      # URL from the service's Settings page. Without it this step says so and
      # does nothing, so a fork or a pull request cannot fire it.
      - name: Deploy to Render
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo 'No RENDER_DEPLOY_HOOK secret set - nothing deployed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl -fsS "$HOOK" > /dev/null
          echo 'Deploy triggered on Render, after every check passed.' >> "$GITHUB_STEP_SUMMARY"
